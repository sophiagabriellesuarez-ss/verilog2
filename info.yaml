# Tiny Tapeout project information
project:
  title:        "DIP Switch to 7-Segment + LED"   # Project title
  author:       "SOPHIA"                       # Your name
  discord:      ""                                # Your discord username (optional)
  description:  "Passes 7 DIP switches straight to a 7-segment display's segments, and an 8th switch to a standalone LED"
  language:     "Verilog"                          # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     0                                  # purely combinational, no clock required

  # How many tiles your design occupies. A single tile is about 167x108 uM.
  tiles: "1x1"                                     # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique, e.g. by
  # including your github username:
  top_module:  "tt_um_dipswitch_7seg"

  # List your project's source files here. Source files must be in ./src
  # and you must list each source file separately, one per line:
  source_files:
    - "project.v"

  # The pinout of your project. Leave unused pins blank.
  # DO NOT delete or add any pins.
  pinout:
    # Inputs
    ui[0]: "DIP switch 1 -> segment A"
    ui[1]: "DIP switch 2 -> segment B"
    ui[2]: "DIP switch 3 -> segment C"
    ui[3]: "DIP switch 4 -> segment D"
    ui[4]: "DIP switch 5 -> segment E"
    ui[5]: "DIP switch 6 -> segment F"
    ui[6]: "DIP switch 7 -> segment G"
    ui[7]: "DIP switch 8 -> morse LED"

    # Outputs
    uo[0]: "segment A"
    uo[1]: "segment B"
    uo[2]: "segment C"
    uo[3]: "segment D"
    uo[4]: "segment E"
    uo[5]: "segment F"
    uo[6]: "segment G"
    uo[7]: "morse LED"

    # Bidirectional pins
    uio[0]: ""
    uio[1]: ""
    uio[2]: ""
    uio[3]: ""
    uio[4]: ""
    uio[5]: ""
    uio[6]: ""
    uio[7]: ""

# Do not change!
yaml_version: 6
